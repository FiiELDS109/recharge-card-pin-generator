<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recharge Card PIN Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --indigo: #260672;
      --indigo-deep: #1a044f;
      --yellow: #ffff8a;
      --green: #0be18d;
    }

    * { box-sizing: border-box; }

    body {
      font-family: "Space Mono", ui-monospace, Menlo, Consolas, monospace;
      background: var(--indigo);
      color: var(--yellow);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }

    .container {
      background: var(--indigo-deep);
      padding: 30px;
      border-radius: 16px;
      border: 2px solid var(--green);
      box-shadow: 8px 8px 0 var(--green);
      text-align: center;
      width: 100%;
      max-width: 360px;
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 20px;
      color: var(--yellow);
    }

    button {
      font-family: inherit;
      font-weight: 700;
      background: var(--green);
      color: var(--indigo);
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      background: var(--yellow);
    }

    button:focus-visible {
      outline: 3px solid var(--yellow);
      outline-offset: 3px;
    }

    .pin {
      margin-top: 20px;
      font-size: 15px;
      letter-spacing: 1px;
      color: var(--green);
      background: var(--indigo);
      border: 1px dashed var(--yellow);
      padding: 12px 6px;
      border-radius: 8px;
      word-break: break-all;
    }

    .disclaimer {
      margin: 20px 0 0;
      font-size: 12px;
      line-height: 1.5;
      color: var(--yellow);
      opacity: 0.85;
    }

    .credit {
      margin: 14px 0 0;
      font-size: 12px;
      color: var(--yellow);
    }

    .credit span {
      color: var(--green);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Recharge Card PIN Generator</h1>
    <button onclick="generatePIN()">Click To Generate PIN</button>
    <div class="pin" id="pinDisplay">----</div>
    <p class="disclaimer">Disclaimer: this is for demonstration purposes only.</p>
    <p class="credit">Made by <span>Fidelis Omoni</span></p>
  </div>

  <script>
    const generatedPins = new Set();

    function randomDigit() {
      return Math.floor(Math.random() * 10);
    }

    function generateBasePin(length = 16) {
      let pin = "";
      for (let i = 0; i < length; i++) {
        pin += randomDigit();
      }
      return pin;
    }

    function checksum(pin) {
      let sum = 0;
      for (let d of pin) sum += Number(d);
      return (sum % 10).toString();
    }

    function isAllSame(pin) {
      return new Set(pin).size === 1;
    }

    function hasLongRepetition(pin, maxRepeat = 4) {
      for (let d of new Set(pin)) {
        if (pin.split(d).length - 1 > maxRepeat) return true;
      }
      return false;
    }

    function hasSequence(pin, maxLen = 3) {
      for (let i = 0; i < pin.length - maxLen; i++) {
        let inc = true;
        let dec = true;
        for (let j = 0; j < maxLen; j++) {
          if (Number(pin[i + j]) + 1 !== Number(pin[i + j + 1])) inc = false;
          if (Number(pin[i + j]) - 1 !== Number(pin[i + j + 1])) dec = false;
        }
        if (inc || dec) return true;
      }
      return false;
    }

    function hasRepeatingPattern(pin) {
      for (let size = 1; size <= 4; size++) {
        for (let i = 0; i < pin.length - size * 2; i++) {
          if (pin.slice(i, i + size) === pin.slice(i + size, i + 2 * size)) {
            return true;
          }
        }
      }
      return false;
    }

    function isValid(pin) {
      return (
        !isAllSame(pin) &&
        !hasLongRepetition(pin) &&
        !hasSequence(pin) &&
        !hasRepeatingPattern(pin)
      );
    }

    function formatPin(pin) {
      return `${pin.slice(0,4)}-${pin.slice(4,8)}-${pin.slice(8,12)}-${pin.slice(12,16)}-${pin.slice(16)}`;
    }

    function generatePIN() {
      let fullPin;
      do {
        const base = generateBasePin();
        fullPin = base + checksum(base);
      } while (!isValid(fullPin) || generatedPins.has(fullPin));

      generatedPins.add(fullPin);
      document.getElementById("pinDisplay").innerText = formatPin(fullPin);
    }
  </script>
</body>
</html>
